<!doctype html>
<!--
	Шаблон WebGL-страницы Unity для портала профессий.
	Положите папку Portal в Assets/WebGLTemplates/ и выберите шаблон Portal в Player Settings > Resolution and Presentation.
	Шаблон подключает portal-bridge.js (копия sdk/web/portal-bridge.js), растягивает игру на весь фрейм портала
	и кладёт экземпляр Unity в window.portalUnityInstance для плагина PortalBridge.jslib.
	Текста на странице нет: всё, что видит игрок, рисует игра.
	Не проверено на реальной Unity-сборке: проверяет первая команда с Unity-игрой (см. sdk/README.md).
-->
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>{{{ PRODUCT_NAME }}}</title>
		<style>
			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				overflow: hidden;
				background: #0b130f;
			}

			#unity-canvas {
				display: block;
				width: 100%;
				height: 100%;
				outline: none;
			}

			/* Полоса загрузки внизу, пока Unity скачивает и запускает сборку */
			#unity-progress {
				position: fixed;
				left: 10%;
				right: 10%;
				bottom: 24px;
				height: 6px;
				overflow: hidden;
				background: rgb(255 255 255 / 0.15);
				border-radius: 999px;
			}

			#unity-progress-fill {
				width: 0;
				height: 100%;
				background: #f2c94c;
				transition: width 0.2s;
			}
		</style>
	</head>
	<body>
		<canvas id="unity-canvas" tabindex="-1"></canvas>
		<div id="unity-progress"><div id="unity-progress-fill"></div></div>
		<script src="portal-bridge.js"></script>
		<script src="Build/{{{ LOADER_FILENAME }}}"></script>
		<script>
			// Настройки загрузки Unity. Файлы берутся из папки Build этой сборки.
			var portalUnityConfig = {
				dataUrl: "Build/{{{ DATA_FILENAME }}}",
				frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
				codeUrl: "Build/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
				memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
				symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
				streamingAssetsUrl: "StreamingAssets",
				companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
				productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
				productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
			};

			var progressFill = document.getElementById("unity-progress-fill");
			var progressBar = document.getElementById("unity-progress");

			createUnityInstance(document.getElementById("unity-canvas"), portalUnityConfig, function (progress) {
				progressFill.style.width = Math.round(progress * 100) + "%";
			})
				.then(function (unityInstance) {
					window.portalUnityInstance = unityInstance;
					progressBar.style.display = "none";
				})
				.catch(function (message) {
					// Сборка не запустилась: портал покажет экран с повтором.
					window.PortalBridge.reportError(String(message));
				});
		</script>
	</body>
</html>
