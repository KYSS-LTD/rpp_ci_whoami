schema: spec-driven

# Контекст проекта: используется как ограничения для всех артефактов OpenSpec.
context: |
  Проект: портал-агрегатор мини-игр для определения подходящей профессии.
  Пользователь проходит игры, получает ачивки и именные дипломы, видит анализ профессий.

  Стек:
  - Фронтенд: Next.js (TypeScript)
  - Бэкенд: FastAPI (Python), только для статистики и админки (не в change mvp-core)
  - База данных: PostgreSQL (не в change mvp-core)

  Ограничения:
  - Регистрации и аккаунтов пользователей нет. Все пользовательские данные хранятся в LocalStorage браузера.
  - Каждая игра состоит ровно из трёх уровней сложности: easy, medium, hard.
  - Игры подключаются модульно через контракт game-module-contract, без изменения ядра.
  - Анализ профессий и дипломы считаются на устройстве пользователя.
  - Оценка игры от 1 до 5 (уточняется: обязательна или нет).

  Стиль кода (CodeStyle.md):
  - Табы вместо пробелов.
  - Длинное тире запрещено, только дефис.
  - Комментарии в коде на русском.
  - Идентификаторы на английском, camelCase или snake_case, понятные имена.
  - Весь отображаемый текст вынесен в отдельные файлы.
  - Режим отладки переключается одной переменной в .env.
  - Коммиты делает пользователь, ИИ коммиты не создаёт.

# Правила для отдельных артефактов (применяются только при их создании).
rules:
  proposal:
    - Указывать, какие capabilities новые, а какие изменяются.
    - Явно перечислять, что не входит в change (сервер, админка, отдельные игры).
  specs:
    - Каждый requirement описывает одно поведение.
    - Каждый requirement имеет минимум один сценарий, сценарии используют ####.
    - Описания requirement не длиннее 500 символов.
    - Текст требований на русском, ключевые слова SHALL и MUST на английском.
  design:
    - Указывать выбор между вариантами и причину.
    - Не дублировать требования из specs.
  tasks:
    - Задачи дробить на части не более 2 часов.

# Рекомендации для фазы apply и archive.
operations:
  apply:
    guidance:
      - Перед коммитом пользователь проверяет работу, агент коммит не делает.
      - Краткие отчёты о тестах.
  archive:
    guidance:
      - Перед завершением кратко сообщить, какие спеки попали в openspec/specs.
